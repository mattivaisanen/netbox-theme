<div class="mb-3">
  <label class="form-label" for="{{ upload.id_for_label }}">{{ upload.label }}</label>
  {% if url %}
    <div class="d-flex align-items-center gap-3 mb-2">
      <img src="{{ url }}" alt="" class="nbt-logo-preview">
      <label class="form-check mb-0">
        <input type="checkbox" name="{{ clear.html_name }}" class="form-check-input">
        <span class="form-check-label">{{ clear.label }}</span>
      </label>
    </div>
  {% endif %}
  <input type="file" name="{{ upload.html_name }}" id="{{ upload.id_for_label }}" class="form-control"
         accept=".svg,.png,.jpg,.jpeg,.gif,.webp,image/*" data-nbt-logo-slot="{{ slot }}">
  {% if upload.help_text %}<div class="form-text">{{ upload.help_text }}</div>{% endif %}
  {% for error in upload.errors %}<div class="text-danger">{{ error }}</div>{% endfor %}
</div>
