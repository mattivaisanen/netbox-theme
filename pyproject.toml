[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-theme"
version = "0.1.0"
description = "Colors, logos and fonts for NetBox's web UI, set by admins for every user."
requires-python = ">=3.10"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "Matti" }]
# No runtime dependencies beyond NetBox (which brings Django). NetBox
# versions are enforced at runtime by min_version in netbox_theme/__init__.py.
dependencies = []

[tool.setuptools.packages.find]
include = ["netbox_theme*"]

[tool.setuptools.package-data]
netbox_theme = [
    "templates/netbox_theme/*.html",
    "templates/netbox_theme/**/*.html",
    "templates/netbox_theme/**/*.css",
]
